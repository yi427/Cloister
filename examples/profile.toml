# Profile V2 example.
# Check: cargo run -- profile check examples/profile.toml
# Plan:  cargo run -- run --profile examples/profile.toml --dry-run -- /bin/sh
schema_version = 2
name = "rust-default"

[image]
# A local image that Cloister will build from a pinned Containerfile.
reference = "cloister/rust-node:dev"
architecture = "arm64"

[guest]
hostname = "cloister"
cpus = 4
# Profile V2 accepts positive integer values with an M or G suffix.
memory = "8G"
user = "cloister"
locale = "zh_CN.UTF-8"
timezone = "Asia/Shanghai"

[network]
# Apple container's default network has internet egress. A future "restricted"
# mode requires Cloister-managed firewall or proxy enforcement.
mode = "default"

[agents.codex]
enabled = true
state = "isolated"

[agents.claude]
enabled = true
state = "isolated"
