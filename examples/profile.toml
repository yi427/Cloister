# Profile V6 example for Cloister agent commands.
schema_version = 6
name = "default"

[image]
reference = "ghcr.io/yi427/cloister:0.2.0"
architecture = "arm64"

[guest]
cpus = 4
memory = "8G"
user = "cloister"
locale = "en_US.UTF-8"
timezone = "America/New_York"

[network]
mode = "default"
proxy = "disabled"

[agent]
state = "shared"

[host.exec]
enabled = true

[host.exec.environment]
mode = "inherit-all"

[[host.exec.allow]]
name = "xcodebuild"
executable = "/usr/bin/xcodebuild"
description = "Build and test Xcode projects"
arguments = "any"
