# Profile V5 example for Cloister agent commands.
schema_version = 5
name = "default"

[image]
reference = "cloister:dev"
architecture = "arm64"

[guest]
cpus = 4
memory = "8G"
user = "cloister"
locale = "en_US.UTF-8"
timezone = "America/New_York"

[network]
mode = "default"

[agent]
state = "shared"

[host.exec]
enabled = true

[host.exec.environment]
mode = "inherit-all"

[[host.exec.allow]]
name = "xcodebuild"
executable = "/usr/bin/xcodebuild"
description = "Build and test Xcode projects"
arguments = "any"
