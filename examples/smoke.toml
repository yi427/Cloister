# Minimal profile for verifying that Cloister can start a real environment.
# Run: cargo run -- run --profile examples/smoke.toml --workspace examples -- /bin/sh
schema_version = 2
name = "smoke"

[image]
reference = "docker.io/library/debian:bookworm-slim"
architecture = "arm64"

[guest]
hostname = "cloister-smoke"
cpus = 2
memory = "1G"
user = "root"
locale = "C.UTF-8"
timezone = "UTC"

[network]
mode = "default"

[agents.codex]
# Profile V2 requires an enabled agent. The smoke image does not install Codex.
enabled = true
state = "isolated"

[agents.claude]
enabled = false
state = "isolated"
