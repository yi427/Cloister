# Profile V3 example for: cloister codex --profile examples/codex.toml
schema_version = 3
name = "codex-default"

[image]
reference = "cloister/rust-node:dev"
architecture = "arm64"

[guest]
cpus = 4
memory = "8G"
user = "cloister"
locale = "zh_CN.UTF-8"
timezone = "Asia/Shanghai"

[network]
mode = "default"

[codex]
state = "shared"
