# Profile V3 example for: cloister codex --profile examples/codex.toml
schema_version = 3
name = "codex-default"

[image]
reference = "cloister/rust-node:dev"
architecture = "arm64"

[guest]
cpus = 4
memory = "8G"
user = "cloister"
locale = "en_US.UTF-8"
timezone = "America/New_York"

[network]
mode = "default"
# proxy = "http://host.container.internal:7890"

[codex]
state = "shared"
