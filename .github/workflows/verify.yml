name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          if [[ -z "${toolchain}" ]]; then
            echo "::error::rust-toolchain.toml must declare one channel"
            exit 1
          fi
          rustup toolchain install "${toolchain}" \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Verify source, tests, and image inputs
        run: make verify
