schema_version = 2
name = "missing-workspace"

[image]
reference = "cloister/rust-node:dev"
architecture = "arm64"

[guest]
hostname = "cloister"
cpus = 4
memory = "8G"
user = "cloister"
locale = "zh_CN.UTF-8"
timezone = "Asia/Shanghai"

[network]
mode = "default"

[agents.codex]
enabled = true
state = "isolated"

[agents.claude]
enabled = true
state = "isolated"
