schema_version = 1
name = "missing-workspace"

[image]
reference = "cloister/rust-node:dev"
architecture = "arm64"

[guest]
hostname = "cloister"
cpus = 4
memory = "8G"
user = "cloister"
locale = "zh_CN.UTF-8"
timezone = "Asia/Shanghai"

[workspace]
mode = "bind"
host = "does-not-exist"
guest = "/workspace"
access = "read-write"

[network]
mode = "default"

[agents.codex]
enabled = true
state = "isolated"

[agents.claude]
enabled = true
state = "isolated"
