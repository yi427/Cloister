schema_version = 8
name = "rust-default"

[image]
reference = "cloister:dev"
architecture = "arm64"

[guest]
cpus = 4
memory = "8G"
user = "cloister"
locale = "en_US.UTF-8"
timezone = "America/New_York"

[network]
mode = "default"
proxy = "disabled"

[agent]
state = "isolated"
codex = "latest"
claude = "latest"
update_interval_hours = 24

[host.exec]
enabled = true
mode = "on-demand"
allow = []

[host.exec.environment]
mode = "inherit-all"
